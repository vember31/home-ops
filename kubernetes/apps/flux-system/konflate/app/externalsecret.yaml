---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name konflate-secret

spec:
  secretStoreRef:
    name: gitlab-secret-store
    kind: ClusterSecretStore

  refreshInterval: "1h"
  target:
    name: *name
    creationPolicy: 'Owner'
    template:
      data:
        # Read token for the forge API + git clone (also raises the rate limit).
        KONFLATE_TOKEN: "{{ .GITHUB_TOKEN }}"
        # Write credential for status checks + PR comments. The PAT needs the
        # "Commit statuses" and "Pull requests" write permissions on the repo.
        KONFLATE_WRITE_TOKEN: "{{ .GITHUB_TOKEN }}"
        # Verifies GitHub's HMAC signature on the public POST /hooks endpoint.
        KONFLATE_WEBHOOK_SECRET: "{{ .KONFLATE_WEBHOOK_SECRET }}"

  dataFrom:
    - extract:
        key: github
    - extract:
        key: konflate
