---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
  namespace: flux-system

spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: konflate

  install:
    timeout: 10m
    replace: true
    remediation:
      retries: 3

  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 3
      strategy: rollback
    cleanupOnFail: true

  test:
    enable: true

  rollback:
    recreate: true
    cleanupOnFail: true

  uninstall:
    keepHistory: false

  maxHistory: 1

  values:
    config:
      repo: github://vember31/home-ops
      publicUrl: https://konflate.local.${SECRET_DOMAIN}
      # Track the cluster this release installs into, so charts that gate on
      # the Kubernetes version or feature-gated APIs render like in-cluster.
      kubeVersion: '{{ .Capabilities.KubeVersion.Version }}'
      helmApiVersions: '{{ join "," .Capabilities.APIVersions }}'
      # Write-back (opt-in): post a commit status and a summary comment on
      # each rendered PR. Needs the write credential in konflate-secret.
      statusChecks: true
      prComments: true
    secret:
      existingSecret: konflate-secret
    monitoring:
      serviceMonitor:
        enabled: true
    # Persistence intentionally disabled (chart default): the source cache and
    # rendered diffs live in an emptyDir, so a pod restart re-clones/re-renders
    # and the recently-merged shelf doesn't survive restarts.
