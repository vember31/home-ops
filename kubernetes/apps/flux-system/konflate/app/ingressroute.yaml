---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: konflate
  namespace: flux-system
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/href: https://konflate.local.${SECRET_DOMAIN}
    gethomepage.dev/description: "Rendered Flux PR Reviews"
    gethomepage.dev/group: Resources
    gethomepage.dev/icon: flux-cd
    gethomepage.dev/name: Konflate
    gethomepage.dev/pod-selector: app.kubernetes.io/name=konflate
    gethomepage.dev/siteMonitor: http://konflate.flux-system.svc.cluster.local:8080/healthz

spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`konflate.local.${SECRET_DOMAIN}`)
      services:
        - name: konflate
          port: 8080
  tls:
    secretName: konflate-tls
