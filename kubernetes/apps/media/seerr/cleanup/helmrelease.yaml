---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name seerr-cleanup
  namespace: media

spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  install:
    timeout: 10m
    replace: true
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 3
      strategy: rollback
    cleanupOnFail: true
    crds: CreateReplace

  rollback:
    recreate: true
    cleanupOnFail: true

  uninstall:
    keepHistory: false

  maxHistory: 1

  values:

    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

    controllers:
      cleanup:
        type: cronjob
        cronjob:
          schedule: "23 4 * * 0"
          timeZone: ${TIMEZONE}
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 3
          backoffLimit: 2
          activeDeadlineSeconds: 300
          ttlSecondsAfterFinished: 3600

        containers:
          app:
            image:
              repository: python
              tag: 3.13-alpine
              pullPolicy: IfNotPresent

            command: ["python", "/scripts/cleanup.py"]

            env:
              SEERR_URL: http://seerr.media.svc.cluster.local:5055/api/v1
              SEERR_API_KEY:
                secretKeyRef:
                  name: seerr-cleanup-secret
                  key: SEERR_API_KEY
              DISCORD_BOT_TOKEN:
                secretKeyRef:
                  name: seerr-cleanup-secret
                  key: DISCORD_BOT_TOKEN
              DISCORD_USER_ID: "338342147222798339"
              DISCORD_NOTIFY_ALWAYS: "false"
              DRY_RUN: "false"
              MIN_AGE_HOURS: "1"
              PYTHONDONTWRITEBYTECODE: "1"
              PYTHONUNBUFFERED: "1"

            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    persistence:
      script:
        type: configMap
        name: seerr-cleanup-configmap
        globalMounts:
          - path: /scripts/cleanup.py
            subPath: cleanup.py
            readOnly: true
