---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seerr-cleanup
spec:
  secretStoreRef:
    name: gitlab-secret-store
    kind: ClusterSecretStore
  target:
    name: seerr-cleanup-secret
    template:
      engineVersion: v2
      data:
        SEERR_API_KEY: "{{ .SEERR_API_KEY }}"
        DISCORD_BOT_TOKEN: "{{ .REQUESTRR_BOT_TOKEN }}"
  dataFrom:
    # The Seerr API key and the Requestrr bot token are provided by the same
    # store entries Requestrr reads.
    - extract:
        key: requestrr
    - extract:
        key: seerr
