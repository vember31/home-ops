---
# jellarr config for the Jellyfin server in the media namespace.
#
# Placeholders like __JELLYFIN_OIDC_CLIENT_ID__ are replaced at pod start by
# the render-config init container (see render_config.py) using the Secret
# generated by the PocketIDOIDCClient in kubernetes/apps/media/jellyfin/app/oidc.
#
# ${...} variables are substituted by Flux from cluster-settings/cluster-secrets.
version: 1
base_url: "http://jellyfin.media.svc.cluster.local:8096"

system:
  enableMetrics: true
  pluginRepositories:
    - name: "Jellyfin Official"
      url: "https://repo.jellyfin.org/releases/plugin/manifest.json"
      enabled: true
    - name: "Intro Skipper"
      url: "https://intro-skipper.org/manifest.json"
      enabled: true
    - name: "Jellyfin Security"
      url: "https://raw.githubusercontent.com/ZL154/JellyfinSecurity/main/manifest.json"
      enabled: true
  trickplayOptions:
    enableHwAcceleration: false
    enableHwEncoding: false

library:
  virtualFolders:
    - name: "Movies"
      collectionType: "movies"
      libraryOptions:
        pathInfos:
          - path: "/media/movies"
          - path: "/media2/movies"
    - name: "TV Shows"
      collectionType: "tvshows"
      libraryOptions:
        pathInfos:
          - path: "/media/tv"
          - path: "/media2/tv"
    - name: "Videos"
      collectionType: "homevideos"
      libraryOptions:
        pathInfos:
          - path: "/media/videos"
    - name: "Recordings"
      collectionType: "homevideos"
      libraryOptions:
        pathInfos:
          - path: "/media/recordings"

plugins:
  # Intro Skipper (intro/credit detection) - stock settings, scheduled tasks
  # analyze the library after install.
  - name: "Intro Skipper"

  - name: "Jellyfin Security"
    configuration:
      Enabled: true
      # Pocket ID OIDC is the primary user sign-in; plugin 2FA stays opt-in.
      PublicBaseUrl: "https://jellyfin.local.${SECRET_DOMAIN}"
      TrustForwardedFor: true
      TrustedProxyCidrs:
        - "${POD_CIDR}"
        - "${SERVICE_CIDR}"
      BlockEmptyPasswordLogin: true
      # No GeoIP databases are mounted, so impossible-travel can't work.
      ImpossibleTravelEnabled: false
      WebAuthnRpId: "jellyfin.local.${SECRET_DOMAIN}"
      WebAuthnOrigins:
        - "https://jellyfin.local.${SECRET_DOMAIN}"
      OidcProviders:
        - Id: "pocket-id"
          DisplayName: "Pocket ID"
          Preset: "pocketid"
          DiscoveryUrl: "https://id.${SECRET_DOMAIN}/.well-known/openid-configuration"
          ClientId: "__JELLYFIN_OIDC_CLIENT_ID__"
          ClientSecret: "__JELLYFIN_OIDC_CLIENT_SECRET__"
          Scopes: "openid profile email groups"
          UsernameClaim: "preferred_username"
          # Pocket ID group name (see pocket-id-operator/groups/jellyfin-users.yaml)
          AllowedGroups: "jellyfin-users"
          AutoCreateUsers: true
          BypassPluginTwoFa: true
          Enabled: true
          ShowLoginButton: true
          ForceHttps: true
