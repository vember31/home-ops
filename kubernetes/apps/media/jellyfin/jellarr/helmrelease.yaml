---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name jellarr
  namespace: media

spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  install:
    timeout: 10m
    replace: true
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 3
      strategy: rollback
    cleanupOnFail: true
    crds: CreateReplace

  test:
    enable: true

  rollback:
    recreate: true
    cleanupOnFail: true

  uninstall:
    keepHistory: false

  maxHistory: 1

  values:

    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    controllers:
      ${APP}:
        type: cronjob
        cronjob:
          schedule: "30 4 * * *"
          timeZone: ${TIMEZONE}
          concurrencyPolicy: Forbid
          # TODO: set to false once JELLARR_API_KEY has been added to the
          # GitLab "jellyfin" variable group (see externalsecret.yaml)
          suspend: true
          successfulJobsHistory: 1
          failedJobsHistory: 3
          backoffLimit: 2
          activeDeadlineSeconds: 600
          ttlSecondsAfterFinished: 3600

        initContainers:
          render-config:
            image:
              repository: python
              tag: 3.14-alpine
              pullPolicy: IfNotPresent

            command:
              - python
              - /templates/render_config.py

            env:
              JELLYFIN_OIDC_CLIENT_ID:
                secretKeyRef:
                  name: jellyfin-oidc-credentials
                  key: client_id
              JELLYFIN_OIDC_CLIENT_SECRET:
                secretKeyRef:
                  name: jellyfin-oidc-credentials
                  key: client_secret

            resources:
              requests:
                cpu: 5m
                memory: 32M
              limits:
                memory: 128M

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

        containers:
          app:
            image:
              repository: ghcr.io/venkyr77/jellarr
              tag: v0.1.0
              pullPolicy: IfNotPresent

            env:
              TZ: ${TIMEZONE}
              JELLARR_API_KEY:
                secretKeyRef:
                  name: jellarr-secret
                  key: JELLARR_API_KEY

            resources:
              requests:
                cpu: 5m
                memory: 64M
              limits:
                memory: 256M

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    persistence:

      # Rendered at pod start from the jellarr-configmap template
      # (Pocket ID OIDC client id/secret injected from jellyfin-oidc-credentials)
      config:
        type: emptyDir
        globalMounts:
          - path: /config

      templates:
        type: configMap
        name: jellarr-configmap
        globalMounts:
          - path: /templates
            readOnly: true

      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
