---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/v0.11.0/dist/schemas/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: jellyfin
  namespace: media
spec:
  name: Jellyfin
  description: Media server
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  callbackUrls:
    # Jellyfin Security plugin route: /TwoFactorAuth/Oidc/Callback/<provider id>
    - https://jellyfin.local.${SECRET_DOMAIN}/TwoFactorAuth/Oidc/Callback/pocket-id
  launchUrl: https://jellyfin.local.${SECRET_DOMAIN}
  pkceEnabled: true
  allowedUserGroups:
    - name: jellyfin-users
      namespace: security
  logo:
    logoUrl: https://raw.githubusercontent.com/jellyfin/jellyfin-ux/master/branding/SVG/icon-transparent.svg
  secret:
    name: jellyfin-oidc-credentials
    additionalLabels:
      app.kubernetes.io/name: jellyfin
