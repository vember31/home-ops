---
apiVersion: v1
kind: ConfigMap
metadata:
  name: silo-jf-gatus-ep
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      - name: "silo-jf"
        group: internal
        url: "https://${GATUS_SUBDOMAIN}-jf.local.${SECRET_DOMAIN}/System/Info/Public"
        interval: 1m
        client:
          dns-resolver: tcp://${BLOCKY_IP}:53
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
            send-on-resolved: true
            failure-threshold: 2
            minimum-reminder-interval: "3h"
