---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/v0.11.0/dist/schemas/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: silo
  namespace: media
spec:
  name: Silo
  description: Media server
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  # Silo builds the callback from the provider installation id, which is
  # assigned when the OpenID Connect Sign-in plugin is installed in the UI.
  # Pocket ID's wildcard matches that single path segment.
  callbackUrls:
    - https://${GATUS_SUBDOMAIN:-${APP}}.local.${SECRET_DOMAIN}/api/v2/auth/oauth/*/callback
    - https://${GATUS_SUBDOMAIN:-${APP}}.local.${SECRET_DOMAIN}/api/v1/auth/oauth/*/callback
  logoutCallbackUrls:
    - https://${GATUS_SUBDOMAIN:-${APP}}.local.${SECRET_DOMAIN}/login
  launchUrl: https://${GATUS_SUBDOMAIN:-${APP}}.local.${SECRET_DOMAIN}
  pkceEnabled: true
  clientSecretOverlap: "168h"
  allowedUserGroups:
    - name: silo-users
      namespace: security
  logo:
    logoUrl: https://raw.githubusercontent.com/Silo-Server/silo-server/main/assets/icon.png
  secret:
    name: silo-oidc-credentials
    additionalLabels:
      app.kubernetes.io/name: silo
