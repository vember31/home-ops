---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo
spec:
  secretStoreRef:
    name: gitlab-secret-store
    kind: ClusterSecretStore
  target:
    name: silo-secret
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ .SILO_POSTGRES_USER }}:{{ .SILO_POSTGRES_PASS }}@postgres-18-rw.database.svc.cluster.local:5432/silo?sslmode=disable"
        REDIS_URL: "redis://dragonfly.database.svc.cluster.local:6379/0"
        SECRET_KEY: "{{ .SILO_SECRET_KEY }}"
        INIT_POSTGRES_DBNAME: silo
        INIT_POSTGRES_HOST: postgres-18-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .SILO_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .SILO_POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnativepg
    - extract:
        key: silo
