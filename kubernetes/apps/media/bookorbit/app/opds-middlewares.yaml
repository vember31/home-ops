---
apiVersion: v1
kind: Secret
metadata:
  name: bookorbit-opds-deny-basic-auth
  namespace: media
type: Opaque
stringData:
  users: |
    opds-denied:{SHA}AS6KR3Yuoz6ygkNQuaDrvwQo3OI=
---

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: bookorbit-opds-strip-secret
  namespace: media
spec:
  headers:
    customRequestHeaders:
      X-Bookorbit-Secret: ""
---

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: bookorbit-opds-failed-auth-rate-limit
  namespace: media
spec:
  rateLimit:
    average: 10
    period: 1m
    burst: 10
---

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: bookorbit-opds-deny-basic-auth
  namespace: media
spec:
  basicAuth:
    realm: DM OPDS
    secret: bookorbit-opds-deny-basic-auth
