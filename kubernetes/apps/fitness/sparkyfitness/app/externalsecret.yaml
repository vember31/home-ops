---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name sparkyfitness-secret
spec:
  secretStoreRef:
    name: gitlab-secret-store
    kind: ClusterSecretStore
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # cnpg
        SPARKY_FITNESS_DB_NAME: &dbName sparkyfitness
        SPARKY_FITNESS_DB_HOST: &dbHost postgres-18-rw.database.svc.cluster.local
        SPARKY_FITNESS_DB_PORT: "5432"
        SPARKY_FITNESS_DB_USER: &dbUser "{{ .SPARKYFITNESS_POSTGRES_USER }}"
        SPARKY_FITNESS_DB_PASSWORD: &dbPass "{{ .SPARKYFITNESS_POSTGRES_PASS }}"
        SPARKY_FITNESS_APP_DB_USER: "{{ .SPARKYFITNESS_APP_DB_USER }}"
        SPARKY_FITNESS_APP_DB_PASSWORD: "{{ .SPARKYFITNESS_APP_DB_PASS }}"

        # app security
        SPARKY_FITNESS_API_ENCRYPTION_KEY: "{{ .SPARKYFITNESS_API_ENCRYPTION_KEY }}"
        BETTER_AUTH_SECRET: "{{ .SPARKYFITNESS_BETTER_AUTH_SECRET }}"

        # postgres-init
        INIT_POSTGRES_DBNAME: *dbName
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"

  dataFrom:
    - extract:
        key: cloudnativepg
    - extract:
        key: sparkyfitness