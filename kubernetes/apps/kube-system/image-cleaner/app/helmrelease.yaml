---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: image-cleaner
  namespace: kube-system

spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  install:
    timeout: 10m
    replace: true
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 3
      strategy: rollback
    cleanupOnFail: true
    crds: CreateReplace

  test:
    enable: true

  rollback:
    recreate: true
    cleanupOnFail: true

  uninstall:
    keepHistory: false

  maxHistory: 1

  values:

    defaultPodOptions:
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, effect: NoSchedule, operator: Exists }
        - { key: node-role.kubernetes.io/master, effect: NoSchedule, operator: Exists }
        - { key: node-role.kubernetes.io/etcd, effect: NoExecute, operator: Exists }
        - { key: CriticalAddonsOnly, operator: Exists }
      securityContext:
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault

    controllers:
      ${APP}:
        type: daemonset
        strategy: RollingUpdate
        rollingUpdate:
          maxUnavailable: "100%"

        containers:
          app:
            image:
              repository: busybox
              tag: "1.38"
            command:
              - /bin/sh
              - -c
              - |
                prune() {
                  echo "[image-cleaner] pruning unused images on $(hostname)"
                  /var/lib/rancher/k3s/data/current/bin/crictl \
                    -r unix:///run/k3s/containerd/containerd.sock rmi --prune
                  echo "[image-cleaner] prune done on $(hostname)"
                }
                prune
                while true; do
                  now=$(date +%s)
                  next=$(date -d "02:00" +%s)
                  [ "$next" -le "$now" ] && next=$((next + 86400))
                  sleep $((next - now))
                  prune
                done
            env:
              TZ: ${TIMEZONE}
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    persistence:
      k3s-data:
        type: hostPath
        hostPath: /var/lib/rancher/k3s/data
        hostPathType: Directory
        globalMounts:
          - path: /var/lib/rancher/k3s/data
            readOnly: true
      containerd-sock:
        type: hostPath
        hostPath: /run/k3s/containerd/containerd.sock
        hostPathType: Socket
        globalMounts:
          - path: /run/k3s/containerd/containerd.sock
            readOnly: true
