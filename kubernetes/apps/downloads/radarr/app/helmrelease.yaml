---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name radarr
  namespace: downloads

spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  install:
    timeout: 10m
    replace: true
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 3
      strategy: rollback
    cleanupOnFail: true
    crds: CreateReplace

  test:
    enable: true

  rollback:
    recreate: true
    cleanupOnFail: true

  uninstall:
    keepHistory: false
    
  maxHistory: 1

  values:

    controllers:
      ${APP}:
        enabled: true
        type: deployment
        annotations: {}
        labels: {}
        replicas: 1

        # Controller-specific overrides for `defaultPodOptions` keys
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"

        containers:
          app:
            nameOverride: radarr
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 7.0.0.10815@sha256:3ba59eb24204da78476590c31a7c72bf9c28227b78d8a412c6f608d71a402506
              pullPolicy: IfNotPresent

            env:
              TZ: ${TIMEZONE}
              RADARR__AUTH__METHOD: Oidc
              RADARR__AUTH__REQUIRED: Enabled
              # Radarr authorizes one OIDC user, matched by verified email or sub.
              # Pocket ID restricts the client to the radarr-users group.
              RADARR__AUTH__OIDCAUTHORITY:
                valueFrom:
                  secretKeyRef:
                    name: radarr-oidc-credentials
                    key: issuer_url
              RADARR__AUTH__OIDCCLIENTID:
                valueFrom:
                  secretKeyRef:
                    name: radarr-oidc-credentials
                    key: client_id
              RADARR__AUTH__OIDCCLIENTSECRET:
                valueFrom:
                  secretKeyRef:
                    name: radarr-oidc-credentials
                    key: client_secret
              RADARR__AUTH__OIDCUSERIDENTIFIER:
                valueFrom:
                  secretKeyRef:
                    name: radarr-secret
                    key: RADARR_OIDC_USER
              RADARR__AUTH__OIDCSCOPES: openid profile email
              RADARR__SERVER__ALLOWEDHOSTS: ${APP}.local.${SECRET_DOMAIN},${APP}.downloads.svc.cluster.local
              RADARR__SERVER__PORT: &port 7878
              RADARR__SERVER__TRUSTEDNETWORKS: "10.42.0.0/16"
              RADARR__LOG__DBENABLED: "False"
              RADARR__LOG__LEVEL: info
              RADARR__UPDATE__BRANCH: develop
              RADARR__AUTH__APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: radarr-secret
                    key: RADARR_API_KEY

            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                    httpHeaders:
                      - name: Host
                        value: localhost
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes

    service:
      app:
        controller: *name
        ports:
          http:
            port: *port

    ingress:
      app:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
          external-dns.alpha.kubernetes.io/target: traefik.local.${SECRET_DOMAIN}
          traefik.ingress.kubernetes.io/router.middlewares: networking-internal-with-errors@kubernetescrd
          hajimari.io/icon: mdi:filmstrip
          hajimari.io/info: &description Movie Collection Management
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: *description
          gethomepage.dev/group: Downloads
          gethomepage.dev/icon: radarr
          gethomepage.dev/name: Radarr
          gethomepage.dev/widget.type: ${APP}
          gethomepage.dev/widget.url: &siteMonitor http://${APP}.downloads.svc.cluster.local:7878
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_RADARR_TOKEN}}` }}"
          gethomepage.dev/widget.enableQueue: "true"
          gethomepage.dev/siteMonitor: *siteMonitor

        hosts:
          - host: &host ${APP}.local.${SECRET_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http

        tls: 
         - secretName: ${APP}-tls-production
           hosts:
             - *host

    persistence:

      config:
        enabled: true
        suffix: config
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 2Gi
        retain: false
        globalMounts: []

      media:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: nfs-omv-media
        globalMounts:
          - path: /media/

      # old hard drive in old server
      media2-tv:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: nfs-omv2-tv
        globalMounts:
          - path: /media2/tv

      media2-movies:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: nfs-omv2-movies
        globalMounts:
          - path: /media2/movies

      