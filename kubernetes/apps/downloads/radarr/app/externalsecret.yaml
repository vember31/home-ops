---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name radarr-secret

spec:
  secretStoreRef:
    name: gitlab-secret-store
    kind: ClusterSecretStore  # or ClusterSecretStore

  refreshInterval: "1h"
  target:
    name: *name
    creationPolicy: 'Owner'

  dataFrom:
    - extract:
        key: radarr #key on gitlab

  data:
    # Radarr allows a single OIDC user, matched by verified email or sub.
    # Reuse the Pocket ID user's GitLab secret so the address stays out of Git.
    - secretKey: RADARR_OIDC_USER
      remoteRef:
        key: pocket_id_users_dm
        property: EMAIL