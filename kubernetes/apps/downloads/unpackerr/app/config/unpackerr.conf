# Unpackerr v1 configuration.
#
# /config is an emptyDir. The /scripts/start-unpackerr.sh wrapper copies this
# file there before exec'ing the daemon, so this ConfigMap (Git) is the source
# of truth. UI changes work until the pod is replaced, then the new pod starts
# from this file again. Copy a UI change you want to keep into this file and
# let Flux restart the pod.
#
# Logs go to stdout and are collected by Fluent Bit into VictoriaLogs. The UI
# Logs page still shows the in-memory live tail and recent errors.
#
# History is kept in /config/unpackerr.history.jsonl and is intentionally
# ephemeral. It survives container restarts within a pod, not pod replacement.
#
# Secrets stay out of this file. Values beginning with filepath: are read from
# the mounted unpackerr-secret at runtime and preserved when the UI saves.
# API keys and the UI password come from the unpackerr-auth Secret, so they are
# stable across pod replacements.

debug = false
keep_history = 400
interval = "2m"
start_delay = "1m"
retry_delay = "5m"
parallel = 1
file_mode = "0644"
dir_mode = "0755"

[webserver]
  metrics = true
  pprof = false
  listen_addr = "0.0.0.0:5656"
  # First login uses admin plus the ui_password key from the unpackerr-auth
  # Secret. Change it in Settings -> Web server; the UI stores a hash here.
  ui_password = "filepath:/auth/ui_password"
  urlbase = "/"
  # Trust X-Forwarded-* from Traefik so login cookies are marked Secure.
  upstreams = ["${POD_CIDR}", "${SERVICE_CIDR}"]

[sonarr.main]
  url = "http://sonarr.downloads.svc.cluster.local:8989"
  api_key = "filepath:/secrets/SONARR_API_KEY"
  paths = ["/media/downloads"]
  protocols = "torrent,TorrentDownloadProtocol"
  timeout = "10s"
  delete_orig = false
  delete_delay = "5m"

[radarr.main]
  url = "http://radarr.downloads.svc.cluster.local:7878"
  api_key = "filepath:/secrets/RADARR_API_KEY"
  paths = ["/media/downloads"]
  protocols = "torrent,TorrentDownloadProtocol"
  timeout = "10s"
  delete_orig = false
  delete_delay = "5m"

[webhook.notifiarr]
  url = "filepath:/secrets/UNPACKERR_NOTIFIARR_URL"
  name = "Notifiarr"
  nickname = "Unpackerr"
