---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name unpackerr-secret

spec:
  secretStoreRef:
    name: gitlab-secret-store
    kind: ClusterSecretStore  # or ClusterSecretStore

  refreshInterval: "1h"
  target:
    name: *name
    creationPolicy: 'Owner'

  dataFrom:
    - extract:
        key: unpackerr
    - extract:
        key: sonarr
    - extract:
        key: radarr
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name unpackerr-auth

spec:
  secretStoreRef:
    name: gitlab-secret-store
    kind: ClusterSecretStore  # or ClusterSecretStore

  # The values are derived from existing secrets so they stay stable across
  # operator restarts. Resync manually if the source API keys are rotated.
  refreshInterval: "0s"
  target:
    name: *name
    creationPolicy: 'Owner'
    template:
      engineVersion: v2
      data:
        # Prometheus scrape key (role: metrics).
        metrics_api_key: "{{ .SONARR_API_KEY | sha256sum }}{{ .RADARR_API_KEY | sha256sum | trunc 30 }}"
        # Stable admin key for scripts; prevents an ephemeral key in the config.
        admin_api_key: "{{ .SONARR_API_KEY | sha256sum }}{{ .RADARR_API_KEY | sha256sum }}"
        # Initial admin password for the web UI. Change it in Settings.
        ui_password: "{{ .SONARR_API_KEY | sha256sum | trunc 24 }}"

  dataFrom:
    - extract:
        key: sonarr
    - extract:
        key: radarr
