---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name unpackerr
  namespace: downloads

spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  install:
    timeout: 10m
    replace: true
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 3
      strategy: rollback
    cleanupOnFail: true
    crds: CreateReplace

  test:
    enable: true

  rollback:
    recreate: true
    cleanupOnFail: true

  uninstall:
    keepHistory: false
    
  maxHistory: 1

  values:

    controllers:
      ${APP}:
        enabled: true
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        labels: {}
        replicas: 1

        containers:
          app:
            image:
              repository: ghcr.io/unpackerr/unpackerr
              tag: v1.0.1@sha256:22b4693fbeaae4bd927905d63b59b8f67b4a1446682d965ac876c61a48976658
              pullPolicy: IfNotPresent

            command:
              - /scripts/start-unpackerr.sh

            env:
              TZ: ${TIMEZONE}
              UN_CONFIG_FILE: /config/unpackerr.conf
              # Prometheus key: metrics read only.
              UN_WEBSERVER_API_KEYS_0_NAME: prometheus
              UN_WEBSERVER_API_KEYS_0_KEY:
                valueFrom:
                  secretKeyRef:
                    name: unpackerr-auth
                    key: metrics_api_key
              UN_WEBSERVER_API_KEYS_0_ROLES_0: metrics
              UN_WEBSERVER_API_KEYS_1_NAME: admin
              UN_WEBSERVER_API_KEYS_1_KEY:
                valueFrom:
                  secretKeyRef:
                    name: unpackerr-auth
                    key: admin_api_key
              UN_WEBSERVER_API_KEYS_1_ROLES_0: admin
              UN_WEBSERVER_ROLES_metrics_PERMISSIONS_0: system:metrics:read

            resources:
              requests:
                cpu: 10m
                memory: 100Mi
              limits:
                memory: 4Gi

            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: *name
        ports:
          http:
            port: 5656

    ingress:
      app:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
          external-dns.alpha.kubernetes.io/target: traefik.local.${SECRET_DOMAIN}
          traefik.ingress.kubernetes.io/router.middlewares: networking-internal-secure@kubernetescrd
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: "Archive Extraction"
          gethomepage.dev/group: Downloads
          gethomepage.dev/icon: unpackerr
          gethomepage.dev/name: Unpackerr
          gethomepage.dev/siteMonitor: &url http://unpackerr.downloads.svc.cluster.local:5656
        hosts:
          - host: &host ${GATUS_SUBDOMAIN:-${APP}}.local.${SECRET_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - secretName: ${APP}-tls-production
            hosts:
              - *host

    serviceMonitor:
      app:
        serviceName: *name
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
            authorization:
              type: Bearer
              credentials:
                name: unpackerr-auth
                key: metrics_api_key

    persistence:

      config:
        type: emptyDir
        globalMounts:
          - path: /config

      history:
        enabled: true
        suffix: history
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 64Mi
        retain: true
        globalMounts:
          - path: /history

      seed:
        type: configMap
        name: unpackerr-config-seed
        defaultMode: 0644
        advancedMounts:
          ${APP}:
            app:
              - path: /seed
                readOnly: true

      scripts:
        type: configMap
        name: unpackerr-scripts
        defaultMode: 0755
        advancedMounts:
          ${APP}:
            app:
              - path: /scripts/start-unpackerr.sh
                subPath: start-unpackerr.sh
                readOnly: true

      credentials:
        type: secret
        name: unpackerr-secret
        advancedMounts:
          ${APP}:
            app:
              - path: /secrets
                readOnly: true

      auth:
        type: secret
        name: unpackerr-auth
        advancedMounts:
          ${APP}:
            app:
              - path: /auth
                readOnly: true

      media:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: nfs-omv-media
        globalMounts:
          - path: /media/
