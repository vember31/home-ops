---
# true or false
sonarrEnabled: true
radarrEnabled: true
whisparrEnabled: false
readarrEnabled: false
lidarrEnabled: false
prowlarrEnabled: true

sonarr:
  sonarr:
    base_url: http://sonarr.downloads.svc.cluster.local:8989
    api_key: !env SONARR_API_KEY

    # Media Naming Configuration
    media_naming:
      series: default
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default

    # Root Folder Setup
    root_folders:
      - /media/tv
      - /media2/tv

    # Quality definition sizes
    quality_definition:
      qualities:
        - quality: "HDTV-720p"
          min: 3
          preferred: 11.7
          max: 28
        - quality: "WEBRip-720p"
          min: 3
          preferred: 11.7
          max: 28
        - quality: "WEBDL-720p"
          min: 3
          preferred: 11.7
          max: 28
        - quality: "Bluray-720p"
          min: 3
          preferred: 11.7
          max: 28
        - quality: "HDTV-1080p"
          min: 4
          preferred: 23
          max: 65
        - quality: "WEBRip-1080p"
          min: 4
          preferred: 23
          max: 65
        - quality: "WEBDL-1080p"
          min: 4
          preferred: 23
          max: 65
        - quality: "Bluray-1080p"
          min: 4
          preferred: 23
          max: 65

    # (experimental) Manage download clients
    download_clients:
      data:
        - name: "qBittorrent"
          type: qbittorrent
          enable: true
          priority: 1
          remove_completed_downloads: false
          remove_failed_downloads: false
          tags: []
          fields:
            host: "qbittorrent.downloads.svc.cluster.local"
            port: 8080
            use_ssl: false
            url_base: /
            username: "admin"
            password: !env QBITTORRENT_PASSWORD
            tv_category: "sonarr"
            tv_imported_category: "sonarr-complete"
      update_password: true
      delete_unmanaged:
        enabled: true
        ignore: []

      # Global download client configuration
      config:
        # download_client_working_folders: ""
        enable_completed_download_handling: true
        auto_redownload_failed: false
        auto_redownload_failed_from_interactive_search: true

radarr:
  radarr:
    base_url: http://radarr.downloads.svc.cluster.local:7878
    api_key: !env RADARR_API_KEY

    # Media Naming Configuration
    media_naming:
      folder: default
      movie:
        rename: true
        standard: standard

    # Root Folder Setup
    root_folders:
      - /media/movies
      - /media2/movies

    # Quality definition sizes
    quality_definition:
      qualities:
        - quality: "HDTV-720p"
          min: 0
          preferred: 18
          max: 34
        - quality: "WEBRip-720p"
          min: 0
          preferred: 18
          max: 34
        - quality: "WEBDL-720p"
          min: 0
          preferred: 18
          max: 34
        - quality: "Bluray-720p"
          min: 0
          preferred: 18
          max: 34
        - quality: "HDTV-1080p"
          min: 0
          preferred: 25
          max: 42
        - quality: "WEBRip-1080p"
          min: 0
          preferred: 25
          max: 42
        - quality: "WEBDL-1080p"
          min: 0
          preferred: 25
          max: 42
        - quality: "Bluray-1080p"
          min: 0
          preferred: 25
          max: 42

    # (experimental) Manage download clients
    download_clients:
      data:
        - name: "qBittorrent"
          type: qbittorrent
          enable: true
          priority: 1
          remove_completed_downloads: false
          remove_failed_downloads: false
          tags: []
          fields:
            host: "qbittorrent.downloads.svc.cluster.local"
            port: 8080
            use_ssl: false
            url_base: /
            username: "admin"
            password: !env QBITTORRENT_PASSWORD
            movie_category: "radarr"
            movie_imported_category: "radarr-complete"
      update_password: true
      delete_unmanaged:
        enabled: true
        ignore: []
      # Global download client configuration
      config:
        # download_client_working_folders: ""
        enable_completed_download_handling: true
        auto_redownload_failed: false
        auto_redownload_failed_from_interactive_search: true
        check_for_finished_download_interval: 1

# experimental support: check https://configarr.de/docs/configuration/experimental-support/#prowlarr-v1
prowlarr:
  main:
    base_url: http://prowlarr.downloads.svc.cluster.local:9696
    api_key: !env PROWLARR_API_KEY

    # Ensure these tag labels exist (created if missing)
    tags:
      - sonarr
      - radarr
    delete_unmanaged_tags:
      enabled: false

    # Indexers - `definition` is the Prowlarr schema definitionName; matched on the server by `name`
    indexers:
      data:
        - name: BroadcasTheNet
          definition: BroadcasTheNet
          enable: true
          priority: 1
          app_profile: Automatic + Interactive
          fields:
            baseUrl: https://api.broadcasthe.net/
            apiKey: !env BTN_API_KEY
            baseSettings.queryLimit: 150
            baseSettings.limitsUnit: 1
            torrentBaseSettings.preferMagnetUrl: false
          tags:
            - sonarr
        - name: IPTorrents
          definition: IPTorrents
          enable: true
          priority: 25
          app_profile: Automatic + Interactive
          fields:
            baseUrl: https://ipt.lol/
            cookie: !env IPT_COOKIE
            userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/112.0.0.0 Safari/537.36"
            freeLeechOnly: false
            searchSortBy: 0
            baseSettings.limitsUnit: 0
            torrentBaseSettings.preferMagnetUrl: false
          tags:
            - radarr
        - name: "IPTorrents "
          definition: IPTorrents
          enable: true
          priority: 2
          app_profile: Interactive Only
          fields:
            baseUrl: https://ipt.lol/
            cookie: !env IPT_COOKIE
            userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/112.0.0.0 Safari/537.36"
            freeLeechOnly: false
            searchSortBy: 0
            baseSettings.limitsUnit: 0
            torrentBaseSettings.preferMagnetUrl: false
          tags:
            - sonarr
        - name: seedpool
          definition: seedpool-api
          enable: true
          priority: 25
          app_profile: Interactive Only
          fields:
            definitionFile: seedpool-api
            apikey: !env SEEDPOOL_API_KEY
            freeleech: false
            tmdbidonly: true
            baseSettings.limitsUnit: 0
            torrentBaseSettings.preferMagnetUrl: false
            sort: 0
            type: 1
          tags:
            - sonarr
            - radarr
        - name: TorrentLeech
          definition: torrentleech
          enable: true
          priority: 25
          app_profile: Interactive Only
          fields:
            definitionFile: torrentleech
            baseUrl: https://www.torrentleech.org/
            username: vember31
            password: !env TL_PASSWORD
            alt2fatoken: !env TL_ALT2FA_TOKEN
            freeleech: false
            baseSettings.limitsUnit: 0
            torrentBaseSettings.preferMagnetUrl: false
            sort: 0
            type: 1
          tags:
            - sonarr
            - radarr
      delete_unmanaged:
        enabled: false

    # Applications - the Sonarr/Radarr instances Prowlarr syncs its indexers to
    applications:
      data:
        - name: Radarr
          type: Radarr
          sync_level: fullSync
          fields:
            prowlarrUrl: http://prowlarr.downloads.svc.cluster.local:9696
            baseUrl: http://radarr.downloads.svc.cluster.local:7878
            apiKey: !env RADARR_API_KEY
            syncCategories: [2000, 2010, 2020, 2030, 2040, 2045, 2050, 2060, 2070, 2080, 2090]
          tags:
            - radarr
        - name: Sonarr
          type: Sonarr
          sync_level: fullSync
          fields:
            prowlarrUrl: http://prowlarr.downloads.svc.cluster.local:9696
            baseUrl: http://sonarr.downloads.svc.cluster.local:8989
            apiKey: !env SONARR_API_KEY
            syncCategories: [5000, 5010, 5020, 5030, 5040, 5045, 5050, 5090]
          tags:
            - sonarr
      delete_unmanaged:
        enabled: false
      # Trigger Prowlarr's global "Sync App Indexers" command after syncing
      sync_indexers: true

    # Download clients (no `config` / `remote_paths` for Prowlarr)
    download_clients:
      data:
        - name: qBittorrent
          type: QBittorrent
          enable: true
          tags: []
          fields:
            host: qbittorrent
            port: 8080
            use_ssl: false
            username: admin
            password: !env QBITTORRENT_PASSWORD
            category: prowlarr
      update_password: true
      delete_unmanaged:
        enabled: false
