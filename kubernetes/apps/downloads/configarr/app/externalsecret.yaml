---

# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: configarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: gitlab-secret-store
  target:
    name: configarr-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
        RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        QBITTORRENT_PASSWORD: "{{ .QBITTORRENT_PASSWORD }}"
        PROWLARR_API_KEY: "{{ .PROWLARR_API_KEY }}"
        BTN_API_KEY: "{{ .BTN_API_KEY }}"
        IPT_COOKIE: "{{ .IPT_COOKIE }}"
        TL_PASSWORD: "{{ .TL_PASSWORD }}"
        SEEDPOOL_API_KEY: "{{ .SEEDPOOL_API_KEY }}"
        TL_ALT2FA_TOKEN: "{{ .TL_ALT2FA_TOKEN }}"
  dataFrom:
    - extract:
        key: sonarr
    - extract:
        key: radarr
    - extract:
        key: qbittorrent
    - extract:
        key: prowlarr
