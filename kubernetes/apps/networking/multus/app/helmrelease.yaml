---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multus
  namespace: kube-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: multus
    namespace: flux-system
  install:
    timeout: 10m
    replace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
    crds: CreateReplace
  values:
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 64Mi
    # k3s uses the containerd CRI defaults on these nodes.
    cni:
      netDir: /etc/cni/net.d
      binDir: /opt/cni/bin
    # Copy macvlan/sbr/etc. onto the host; Cilium/loopback are left alone.
    cniPlugins:
      enabled: true
