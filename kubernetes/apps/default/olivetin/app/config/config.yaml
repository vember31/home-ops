---
# There is a built-in micro proxy that will host the webui and REST API all on
# one port (this is called the "Single HTTP Frontend") and means you just need
# one open port in the container/firewalls/etc.
#
# Listen on all addresses available, port 1337
listenAddressSingleHTTPFrontend: 0.0.0.0:1337

# Choose from INFO (default), WARN and DEBUG
logLevel: "INFO"

# Custom theme (see theme.css in this directory) - widens the PR dashboard cards.
themeName: home-ops

# Actions (buttons) to show up on the WebUI:
actions:

  - title: Disable Blocky for 5 minutes
    icon: <iconify-icon icon="vscode-icons:file-type-go-gopher"></iconify-icon>
    shell: /scripts/olivetin-blocky-script.sh disable 5m
    maxConcurrent: 1
    timeout: 10

  - title: Disable AdGuard Home for 5 minutes
    icon: <iconify-icon icon="arcticons:adguard-home-manager"></iconify-icon> 
    maxConcurrent: 1
    timeout: 10
    shell: |
      curl -X POST "http://${ADGUARD_LXC_IP}/control/protection" \
        -H "Accept: application/json" \
        -H "Content-Type: application/json" \
        -H "Authorization: Basic {{ .ADGUARD_USERPASS_BASE64 }}" \
        -d '{"enabled":false,"duration":300000}'

  - title: Blocky Status
    icon: <iconify-icon icon="vscode-icons:file-type-go-gopher"></iconify-icon>
    shell: /scripts/olivetin-blocky-script.sh status
    maxConcurrent: 1
    timeout: 10
    popupOnStart: execution-dialog

  - title: Blocky All Commands
    shell: /scripts/olivetin-blocky-script.sh {{ `{{blocky_action}}` }} {{ `{{blocky_duration}}` }}m
    timeout: 10
    icon: <iconify-icon icon="vscode-icons:file-type-go-gopher"></iconify-icon>
    popupOnStart: execution-dialog
    arguments:
      - name: blocky_action
        choices:
          - title: Disable
            value: disable
          - title: Enable
            value: enable
          - title: Status
            value: status
      - name: blocky_duration
        type: int

  - title: Restart Media & Download Apps
    shell: /scripts/restart_download_media_apps.sh
    maxConcurrent: 1
    timeout: 10
    icon: <iconify-icon icon="solar:restart-linear"></iconify-icon>
    popupOnStart: execution-dialog

  - title: Sync Autobrr ARR Lists (Sonarr/Radarr)
    icon: <iconify-icon icon="mdi:sync"></iconify-icon>
    shell: |
      echo "Triggering autobrr ARR list refresh..."
      if curl -fsS -o /dev/null -w "autobrr responded with HTTP %{http_code}\n" \
           -X POST http://autobrr.downloads.svc.cluster.local:7474/api/webhook/lists/trigger/arr \
           -H "X-API-Token: {{ .AUTOBRR_API_KEY }}"; then
        sleep 2
        echo
        echo "List status:"
        curl -fsS -H "X-API-Token: {{ .AUTOBRR_API_KEY }}" \
          http://autobrr.downloads.svc.cluster.local:7474/api/lists \
          | jq -r '.[] | "  \(.name) (\(.type)): \(.last_refresh_status) @ \(.last_refresh_time)"'
        echo
        echo "Done - autobrr is re-pulling monitored titles from Sonarr and Radarr."
      else
        echo "ERROR: could not trigger the autobrr list refresh (see curl error above)." >&2
        exit 1
      fi
    maxConcurrent: 1
    timeout: 10
    popupOnStart: execution-dialog

  - title: Merge Open GitHub PRs
    id: merge_open_prs
    icon: <iconify-icon icon="mdi:source-merge"></iconify-icon>
    shell: /scripts/merge-open-prs.sh
    maxConcurrent: 1
    timeout: 300
    popupOnStart: execution-dialog
    arguments:
      - name: merge_mode
        title: Mode
        description: Preview only lists what would be merged. Pick "Merge for real" to actually merge every matching PR.
        default: preview
        choices:
          - title: Preview only (dry run)
            value: preview
          - title: Merge for real
            value: merge

      - name: pr_author
        title: PR author
        description: Only merge pull requests opened by this account.
        default: renovate[bot]
        choices:
          - title: Renovate bot (recommended)
            value: renovate[bot]
          - title: All authors
            value: any
          - title: Me (vember31)
            value: vember31

      - name: required_label
        title: Required label
        description: Restrict merging to PRs carrying a specific label - useful to only merge changes Renovate is already allowed to auto-merge.
        default: any
        choices:
          - title: Any label
            value: any
          - title: "🤖 renovate/automerge"
            value: "🤖 renovate/automerge"
          - title: "🐳 renovate/container"
            value: "🐳 renovate/container"
          - title: "📌 type/digest"
            value: "📌 type/digest"

      - name: merge_method
        title: Merge method
        default: squash
        choices:
          - title: Squash
            value: squash
          - title: Merge commit
            value: merge
          - title: Rebase
            value: rebase

      - name: delete_branch
        title: Delete source branch after merge
        type: checkbox
        description: Only affects branches in this repository - branches from forks are never touched.
        choices:
          - title: "1"
            value: --delete-branches
          - title: "0"
            value: ""

  # One button per open PR, rendered on the Pull Requests dashboard.
  - title: 'Merge PR #{{ `{{ pr.number }}` }}'
    entity: pr
    icon: <iconify-icon icon="mdi:source-merge"></iconify-icon>
    shell: /scripts/merge-open-prs.sh --mode merge --pr {{ `{{ pr.number }}` }} --delete-branches
    maxConcurrent: 1
    timeout: 300
    popupOnStart: execution-dialog

  # Rebuilds the Pull Requests dashboard (one card per open PR with changelog).
  - title: Refresh Open PR List
    id: refresh_open_pr_list
    icon: <iconify-icon icon="mdi:refresh"></iconify-icon>
    shell: /scripts/fetch-open-prs.sh
    timeout: 60
    popupOnStart: execution-dialog
    execOnStartup: true
    execOnCron: '*/5 * * * *'

# Open PRs for the Pull Requests dashboard. fetch-open-prs.sh rewrites this file
# (NDJSON, one entity per line) on startup, every 5 minutes, and after merges.
entities:
  - file: /tmp/olivetin-entities/prs.json
    name: pr
    icon: <iconify-icon icon="mdi:source-pull"></iconify-icon>
    properties:
      - name: number
        title: PR
      - name: title
        title: Title
      - name: author
        title: Author
      - name: updated
        title: Updated
      - name: labels
        title: Labels

dashboards:
  - title: Pull Requests
    contents:
      - title: Actions
        type: fieldset
        cssClass: pr-actions
        contents:
          - title: Refresh Open PR List
          - title: Merge Open GitHub PRs

      # One card per open PR: changelog + a merge button just for that PR.
      - type: fieldset
        entity: pr
        cssClass: pr-cards
        title: '#{{ `{{ pr.number }}` }} {{ `{{ pr.title }}` }}'
        contents:
          - type: display
            title: |
              <a href="{{ `{{ pr.url }}` }}" target="_blank" rel="noopener noreferrer">View on GitHub</a>
              &nbsp;·&nbsp; @{{ `{{ pr.author }}` }} &nbsp;·&nbsp; updated {{ `{{ pr.updated }}` }} &nbsp;·&nbsp; {{ `{{ pr.labels }}` }}
              <pre style="white-space: pre-wrap; overflow-wrap: anywhere; max-height: 28em; overflow-y: auto; margin: 0.6em 0 0;">{{ `{{ pr.changelog }}` }}</pre>
          - title: 'Merge PR #{{ `{{ pr.number }}` }}'