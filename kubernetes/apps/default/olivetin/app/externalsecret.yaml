---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name olivetin-secret

spec:
  secretStoreRef:
    name: gitlab-secret-store
    kind: ClusterSecretStore  # or ClusterSecretStore

  # Rendered config.yaml comes from a ConfigMap, which ESO does not watch - keep
  # this short so oliveTin config changes show up without a manual force-sync.
  refreshInterval: "5m"
  target:
    name: *name
    creationPolicy: 'Owner'
    template:
      data:
        # Exposed to the pod as the GITHUB_TOKEN env var (see helmrelease.yaml).
        # dataFrom keys are only template context by default - this makes the
        # token a key on the generated Secret as well.
        GITHUB_TOKEN: "{{ .GITHUB_TOKEN }}"
      templateFrom:
        - configMap:
            name: olivetin-config
            items:
              - key: config.yaml

  dataFrom:
  - extract:
      key: adguard_lxc
  - extract:
      key: autobrr
  # GitLab CI/CD variable 'github' -> JSON: {"GITHUB_TOKEN": "github_pat_..."}
  # Mounted into the OliveTin pod as the GITHUB_TOKEN env var (see helmrelease.yaml).
  - extract:
      key: github

---
# Dispatcharr API key for OliveTin's "Assign Stream to Channel 1" action.
#
# Own secret (not merged into olivetin-secret) so the two can rotate
# independently. Requires DISPATCHARR_API_TOKEN in the GitLab 'dispatcharr'
# secret - the same JSON the Dispatcharr app reads its Postgres credentials
# from. The HelmRelease uses this key as a required env var, so OliveTin does
# not start until the key exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &dispatcharrSecret olivetin-dispatcharr
spec:
  secretStoreRef:
    name: gitlab-secret-store
    kind: ClusterSecretStore

  refreshInterval: 5m
  target:
    name: *dispatcharrSecret
    creationPolicy: Owner

  data:
    - secretKey: DISPATCHARR_API_TOKEN
      remoteRef:
        key: dispatcharr
        property: DISPATCHARR_API_TOKEN