---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/v0.11.0/dist/schemas/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: termix
  namespace: security
spec:
  name: termix
  description: SSH and remote desktop management
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  callbackUrls:
    - https://${GATUS_SUBDOMAIN:-${APP}}.local.${SECRET_DOMAIN}/users/oidc/callback
  logoutCallbackUrls:
    - https://${GATUS_SUBDOMAIN:-${APP}}.local.${SECRET_DOMAIN}
  launchUrl: https://${GATUS_SUBDOMAIN:-${APP}}.local.${SECRET_DOMAIN}
  pkceEnabled: true
  clientSecretOverlap: "168h"
  allowedUserGroups:
    - name: admins
      namespace: security
  logo:
    logoUrl: https://docs.termix.site/img/logo.svg
  secret:
    name: termix-oidc-credentials
    additionalLabels:
      app.kubernetes.io/name: termix