---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: security
spec:
  chart:
    spec:
      chart: crowdsec
      version: 0.24.2
      sourceRef:
        kind: HelmRepository
        name: crowdsec
        namespace: flux-system

  interval: 15m
  timeout: 5m

  install:
    timeout: 10m
    replace: true
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 3
      strategy: rollback
    cleanupOnFail: true
    crds: CreateReplace

  test:
    enable: true

  rollback:
    recreate: true
    cleanupOnFail: true

  uninstall:
    keepHistory: false

  maxHistory: 1

  values:
    # yaml-language-server: $schema=https://raw.githubusercontent.com/crowdsecurity/helm-charts/main/charts/crowdsec/values.schema.json

    image:
      repository: crowdsecurity/crowdsec
      tag: v1.8.1

    # Detection is handled by the AppSec component fed by the Traefik bouncer
    # plugin. No log acquisition is configured, so the agent is not needed.
    agent:
      enabled: false

    # WAF: the Traefik bouncer plugin forwards every request here for in-band
    # analysis (virtual patching + generic web attack rules). Decisions feed the
    # LAPI and are enforced by the bouncer in stream mode.
    appsec:
      enabled: true
      acquisitions:
        - source: appsec
          listen_addr: "0.0.0.0:7422"
          path: /
          appsec_config: crowdsecurity/appsec-default
          labels:
            type: appsec
      env:
        - name: COLLECTIONS
          value: "crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules"

    # The HTTP notification plugin feeds locally-created decisions (with geo/AS
    # enrichment) into VictoriaMetrics as the `cs_lapi_decision` metric, which
    # powers the "Crowdsec Cyber Threat Insights" Grafana dashboard.
    config:
      profiles.yaml: |
        name: default_ip_remediation
        filters:
          - Alert.Remediation == true && Alert.GetScope() == "Ip"
        decisions:
          - type: ban
            duration: 4h
        notifications:
          - http_default
        on_success: break
        ---
        name: default_range_remediation
        filters:
          - Alert.Remediation == true && Alert.GetScope() == "Range"
        decisions:
          - type: ban
            duration: 4h
        notifications:
          - http_default
        on_success: break
      notifications:
        http.yaml: |
          type: http
          name: http_default
          log_level: info
          format: >
            {{- range $Alert := . -}}
            {{- range .Decisions -}}
            {"metric":{"__name__":"cs_lapi_decision","instance":"home-ops","country":"{{$Alert.Source.Cn}}","asname":"{{$Alert.Source.AsName}}","asnumber":"{{$Alert.Source.AsNumber}}","latitude":"{{$Alert.Source.Latitude}}","longitude":"{{$Alert.Source.Longitude}}","iprange":"{{$Alert.Source.Range}}","scenario":"{{.Scenario}}","type":"{{.Type}}","duration":"{{.Duration}}","scope":"{{.Scope}}","ip":"{{.Value}}"},"values":[1],"timestamps":[{{now|unixEpoch}}000]}
            {{- end -}}
            {{- end -}}
          url: http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428/api/v1/import
          method: POST
          headers:
            Content-Type: application/json

    lapi:
      env:
        - name: ENROLL_KEY
          valueFrom:
            secretKeyRef:
              name: crowdsec-keys
              key: ENROLL_KEY
        - name: ENROLL_INSTANCE_NAME
          value: home-ops
        - name: ENROLL_TAGS
          value: "k8s,traefik"
        - name: BOUNCER_KEY_traefik
          valueFrom:
            secretKeyRef:
              name: crowdsec-keys
              key: BOUNCER_KEY_traefik