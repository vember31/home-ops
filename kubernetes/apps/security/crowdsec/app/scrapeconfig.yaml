---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: crowdsec
  namespace: security
spec:
  scrapeInterval: 1m
  scrapeTimeout: 10s
  honorTimestamps: true
  staticConfigs:
    - labels:
        job: crowdsec
      targets:
        - crowdsec-service.security.svc.cluster.local:6060