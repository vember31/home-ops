---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name crowdsec-web-ui
  namespace: security

spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  install:
    timeout: 10m
    replace: true
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 3
      strategy: rollback
    cleanupOnFail: true
    crds: CreateReplace

  test:
    enable: true

  rollback:
    recreate: true
    cleanupOnFail: true

  uninstall:
    keepHistory: false

  maxHistory: 1

  values:

    controllers:
      ${APP}:
        enabled: true
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1

        containers:
          app:
            image:
              repository: ghcr.io/theduffman85/crowdsec-web-ui
              tag: 2026.8.3
              pullPolicy: IfNotPresent

            env:
              TZ: ${TIMEZONE}
              CONFIG_AUTH_ENABLED: "true"
              CONFIG_AUTH_OIDC_ISSUER_URL:
                valueFrom:
                  secretKeyRef:
                    name: crowdsec-web-ui-oidc-credentials
                    key: issuer_url
              CONFIG_AUTH_OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: crowdsec-web-ui-oidc-credentials
                    key: client_id
              CONFIG_AUTH_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: crowdsec-web-ui-oidc-credentials
                    key: client_secret
              CONFIG_AUTH_OIDC_SCOPE: "openid profile email groups"
              CONFIG_AUTH_OIDC_GROUPS_CLAIM: "groups"
              CONFIG_AUTH_OIDC_ADMIN_GROUPS: '["admins"]'
              CONFIG_INSTANCE_LAPI_URL: "http://crowdsec-service.security.svc.cluster.local:8080"
              CONFIG_INSTANCE_LAPI_AUTH_USERNAME: "crowdsec-web-ui"
              CONFIG_INSTANCE_LAPI_AUTH_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: crowdsec-keys
                    key: CROWDSEC_WEBUI_LAPI_PASSWORD

            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 3000
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: *name
        ports:
          http:
            port: *port

    ingress:
      app:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
          external-dns.alpha.kubernetes.io/target: traefik.local.${SECRET_DOMAIN}
          traefik.ingress.kubernetes.io/router.middlewares: networking-internal-with-errors@kubernetescrd
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: "CrowdSec dashboard"
          gethomepage.dev/group: Security
          gethomepage.dev/icon: https://raw.githubusercontent.com/TheDuffman85/crowdsec-web-ui/main/client/public/logo.svg
          gethomepage.dev/name: CrowdSec Web UI
          gethomepage.dev/siteMonitor: http://crowdsec-web-ui.security.svc.cluster.local:3000

        hosts:
          - host: &host ${GATUS_SUBDOMAIN:-${APP}}.local.${SECRET_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http

        tls:
         - secretName: ${APP}-tls-production
           hosts:
             - *host

    persistence:

      data:
        enabled: true
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 1Gi
        retain: true
        globalMounts:
          - path: /app/data

      tmp:
        type: emptyDir