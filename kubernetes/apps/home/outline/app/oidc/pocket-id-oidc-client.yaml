---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/v0.11.0/dist/schemas/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: outline
  namespace: home
spec:
  name: Outline
  description: Note-taking & Documentation
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  callbackUrls:
    - https://${GATUS_SUBDOMAIN:-${APP}}.${SECRET_DOMAIN}/auth/oidc.callback
  logoutCallbackUrls:
    - https://${GATUS_SUBDOMAIN:-${APP}}.${SECRET_DOMAIN}
  launchUrl: https://${GATUS_SUBDOMAIN:-${APP}}.${SECRET_DOMAIN}
  allowedUserGroups:
    - name: outline-users
      namespace: security
  logo:
    logoUrl: https://raw.githubusercontent.com/outline/outline/v1.10.1/public/logos/outline-logo-light.png
    darkLogoUrl: https://raw.githubusercontent.com/outline/outline/v1.10.1/public/logos/outline-logo-dark.png
  secret:
    name: outline-oidc-credentials
    additionalLabels:
      app.kubernetes.io/name: outline
