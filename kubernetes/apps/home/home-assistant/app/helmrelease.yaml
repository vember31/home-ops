---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name home-assistant
  namespace: home
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    timeout: 10m
    replace: true
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      remediateLastFailure: true
      strategy: rollback
      retries: 3
    crds: CreateReplace
  test:
    enable: true
  rollback:
    recreate: true
    cleanupOnFail: true
  uninstall:
    keepHistory: false
  maxHistory: 1
  values:
    controllers:
      home-assistant:
        type: deployment
        # Started at cutover after the PVC is seeded and HAOS VM 300 is stopped.
        replicas: 1
        strategy: Recreate
        pod:
          annotations:
            # Restart HA when the Git-managed ConfigMaps/Secret change.
            reloader.stakater.com/auto: "true"
            # net1 keeps 192.168.2.7 and the old HAOS MAC; eth0 stays Cilium.
            k8s.v1.cni.cncf.io/networks: >-
              [{"name":"lan","namespace":"networking","interface":"net1","ips":["192.168.2.7/24"],"mac":"02:96:57:5c:1a:5e"}]
          terminationGracePeriodSeconds: 300
          securityContext:
            fsGroup: 0
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18
            envFrom:
              - secretRef:
                  name: home-assistant-db
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
        containers:
          app:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: "2026.11.3@sha256:24e541ddae5818bf8eb27898b9ba00d0c344a655aa5097e9e9bd4b19356be847"
              pullPolicy: IfNotPresent
            env:
              TZ: ${TIMEZONE}
              HASS_DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-db
                    key: HASS_DB_URL
            ports:
              - name: http
                containerPort: 8123
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /manifest.json
                    port: 8123
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /manifest.json
                    port: 8123
                  failureThreshold: 60
                  periodSeconds: 10
          eufy-security-ws:
            image:
              repository: bropat/eufy-security-ws
              tag: "3.1.0@sha256:d41169205f4e20e1e7e173283aaf8bb2d68e2abecb42bc1500a5fac5bb7a8750"
              pullPolicy: IfNotPresent
            env:
              USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: eufy-security-ws
                    key: username
              PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: eufy-security-ws
                    key: password
              COUNTRY:
                value: US
              PORT:
                value: "3000"
              POLLING_INTERVAL_MINUTES:
                value: "10"
              ACCEPT_INVITATIONS:
                value: "true"
              EVENT_DURATION_SECONDS:
                value: "10"
            ports:
              - name: eufy-ws
                containerPort: 3000
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
    service:
      app:
        controller: home-assistant
        ports:
          http:
            port: 8123
    ingress:
      external:
        # external-dns owns ha.vember31.xyz now that the old tunnel CNAME is gone.
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
          external-dns.kubernetes.io/target: "ipv4.${SECRET_DOMAIN}"
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          # CrowdSec + error pages + Cloudflare IP allowlist.
          traefik.ingress.kubernetes.io/router.middlewares: networking-external-with-errors@kubernetescrd
        hosts:
          - host: &externalHost ha.${SECRET_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - secretName: home-assistant-tls-external
            hosts:
              - *externalHost
    persistence:
      config:
        enabled: true
        existingClaim: home-assistant-config
        advancedMounts:
          home-assistant:
            app:
              - path: /config
              - path: /media
                subPath: media
            eufy-security-ws:
              - path: /data
                subPath: eufy
      config-files:
        type: configMap
        name: home-assistant-config
        advancedMounts:
          home-assistant:
            app:
              - path: /config/configuration.yaml
                subPath: configuration.yaml
                readOnly: true
      packages:
        type: configMap
        name: home-assistant-packages
        advancedMounts:
          home-assistant:
            app:
              - path: /config/packages
                readOnly: true
      # No secrets.yaml mount: the current HAOS config has no !secret references (§6.2.5).
