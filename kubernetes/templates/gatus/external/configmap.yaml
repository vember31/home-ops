---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "${APP}-gatus-ep"
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      - name: "${APP}"
        group: external
        url: "https://${GATUS_SUBDOMAIN:-${APP}}.${SECRET_DOMAIN}${GATUS_PATH:-/}"
        interval: 1m
        client:
          # override with GATUS_DNS_RESOLVER on apps that need split-horizon
          # dns (blocky), e.g. DNS-only records where NAT hairpin to the wan
          # ip isn't available from inside the cluster
          dns-resolver: ${GATUS_DNS_RESOLVER:-tcp://1.1.1.1:53}
          timeout: 60s
        conditions:
          - "[STATUS] == ${GATUS_STATUS:-200}"
        alerts:
          - type: discord
            send-on-resolved: true
            failure-threshold: 2
            minimum-reminder-interval: "3h"