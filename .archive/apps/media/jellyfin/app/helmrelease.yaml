---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name jellyfin
  namespace: media

spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  install:
    timeout: 10m
    replace: true
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3

  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 3
      strategy: rollback
    cleanupOnFail: true
    crds: CreateReplace

  test:
    enable: true

  rollback:
    recreate: true
    force: true
    cleanupOnFail: true

  uninstall:
    keepHistory: false
    
  maxHistory: 1

  values:

    controllers:
      ${APP}:
        enabled: true
        type: deployment
        annotations: {}
        replicas: 1

        # Controller-specific overrides for `defaultPodOptions` keys
        pod:

          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"

          # keep media streaming off of nas, utility servers
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: node-role
                    operator: NotIn
                    values:
                      - nas
                      - utility

          # jellyfin/jellyfin#17831: default 30s can SIGKILL the shutdown VACUUM+ANALYZE on v12
          terminationGracePeriodSeconds: 120

        containers:
          app:
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: 12.1@sha256:008ec8024bdaaa6f0a3f0de468e185633eeba9d67c56936e8dbf5ef6b8d6200f
              pullPolicy: IfNotPresent

            env:
              TZ: ${TIMEZONE}
              DOTNET_SYSTEM_IO_DISABLEFILELOCKING: "true"
              JELLYFIN_PublishedServerUrl: https://${APP}.local.${SECRET_DOMAIN}

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

            resources:
              requests:
                cpu: 100m
              limits:
                memory: 2Gi

            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8096
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 30

    service:
      app:
        controller: *name
        ports:
          http:
            port: *port

    ingress:
      app:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
          external-dns.alpha.kubernetes.io/target: traefik.local.${SECRET_DOMAIN}
          traefik.ingress.kubernetes.io/router.middlewares: networking-internal-with-errors@kubernetescrd
          hajimari.io/icon: simple-icons:jellyfin
          hajimari.io/info: &description Open-source Media Server
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: *description
          gethomepage.dev/group: Media
          gethomepage.dev/icon: jellyfin
          gethomepage.dev/name: Jellyfin
          gethomepage.dev/widget.type: ${APP}
          gethomepage.dev/widget.url: &siteMonitor http://${APP}.media.svc.cluster.local:8096
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_JELLYFIN_TOKEN}}` }}"
          gethomepage.dev/siteMonitor: *siteMonitor

        hosts:
          - host: &host ${APP}.local.${SECRET_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http

        tls: 
         - secretName: ${APP}-tls-production
           hosts:
             - *host

    persistence:

      config:
        enabled: true
        suffix: config
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 10Gi
        retain: true
        globalMounts: []
      
      cache:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /cache

      tmp:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /tmp

      tv:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: nfs-omv-media-tv
        globalMounts:
          - path: /media/tv
            readOnly: true

      movies:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: nfs-omv-media-movies
        globalMounts:
          - path: /media/movies
            readOnly: true

      videos:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: nfs-omv-media-videos
        globalMounts:
          - path: /media/videos
            readOnly: false

      # old hard drive in old server
      movies2:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: nfs-omv2-media-movies
        globalMounts:
          - path: /media2/movies
            readOnly: true

      # old hard drive in old server
      tv2:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: nfs-omv2-media-tv
        globalMounts:
          - path: /media2/tv
            readOnly: true

      # live tv recordings
      recordings:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: nfs-omv-media-recordings
        globalMounts:
          - path: /media/recordings
            readOnly: false # allow jellyfin to record to this too