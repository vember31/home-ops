---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/v0.11.0/dist/schemas/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: sparkyfitness
  namespace: fitness
spec:
  name: SparkyFitness
  description: Family fitness & food tracking
  instanceSelector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  callbackUrls:
    - https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}/api/auth/sso/callback/sparkyfitness
  logoutCallbackUrls:
    - https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}
  launchUrl: https://${GATUS_SUBDOMAIN}.${SECRET_DOMAIN}
  pkceEnabled: true
  allowedUserGroups:
    - name: sparkyfitness-users
      namespace: security
  logo:
    logoUrl: https://raw.githubusercontent.com/CodeWithCJ/SparkyFitness/main/SparkyFitnessFrontend/public/images/icons/icon-512x512.png
  secret:
    name: sparkyfitness-oidc-credentials
    additionalLabels:
      app.kubernetes.io/name: sparkyfitness